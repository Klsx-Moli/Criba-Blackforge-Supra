name: Monorepo CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  criba-blackforge:
    name: CRIBA / BLACKFORGE
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: criba-blackforge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.28'
          enable-cache: true
          cache-dependency-glob: criba-blackforge/uv.lock
      - name: Install locked dependencies
        shell: pwsh
        run: uv sync --all-extras --locked
      - name: Run CRIBA / BLACKFORGE tests
        shell: pwsh
        run: uv run --locked pytest -q
      - name: Enforce mypy baseline
        shell: pwsh
        run: uv run --locked python scripts/check_mypy_baseline.py

  supra:
    name: SUPRA
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: supra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.28'
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: supra/uv.lock
      - name: Install locked dependencies
        shell: pwsh
        run: uv sync --all-extras --locked
      - name: Run SUPRA tests
        shell: pwsh
        run: uv run --locked pytest -q --no-header
      - name: Ruff
        shell: pwsh
        run: uv run --locked ruff check .
      - name: Type-check
        shell: pwsh
        run: uv run --locked mypy src/supra_agentic

  result:
    name: monorepo-result
    if: ${{ !cancelled() }}
    needs: [criba-blackforge, supra]
    runs-on: ubuntu-latest
    steps:
      - name: Require component jobs
        env:
          CRIBA_RESULT: ${{ needs.criba-blackforge.result }}
          SUPRA_RESULT: ${{ needs.supra.result }}
        run: |
          test "$CRIBA_RESULT" = success
          test "$SUPRA_RESULT" = success
