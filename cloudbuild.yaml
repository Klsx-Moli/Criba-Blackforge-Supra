steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/supra-agentic-taskmaster:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/supra-agentic-taskmaster:latest'
      - '.'

  # 2. Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/supra-agentic-taskmaster:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'supra-agentic-taskmaster'
      - '--image'
      - 'gcr.io/$PROJECT_ID/supra-agentic-taskmaster:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/supra-agentic-taskmaster:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/supra-agentic-taskmaster:latest'
